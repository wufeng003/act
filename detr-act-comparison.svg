<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3578e5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#159a72"/>
    </marker>
    <style>
      .cn { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 52px; font-weight: 700; fill: #182033; }
      .subtitle { font-size: 25px; fill: #667085; }
      .lane-title { font-size: 34px; font-weight: 700; }
      .box-title { font-size: 28px; font-weight: 700; fill: #182033; }
      .box-sub { font-size: 22px; fill: #667085; }
      .tag { font-size: 21px; font-weight: 700; }
      .note { font-size: 24px; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f6f8fc"/>
  <text x="800" y="82" text-anchor="middle" class="cn title">从 DETR 到 ACT：神经网络如何被改造</text>
  <text x="800" y="125" text-anchor="middle" class="cn subtitle">保留 CNN + Transformer 主干，改变输入信息与预测目标</text>

  <rect x="70" y="175" width="1460" height="300" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="175" width="18" height="300" rx="9" fill="#3578e5"/>
  <text x="120" y="230" class="cn lane-title" fill="#285fae">DETR · 目标检测</text>

  <rect x="135" y="275" width="250" height="120" rx="14" fill="#eaf2ff" stroke="#99bdf5" stroke-width="2"/>
  <text x="260" y="326" text-anchor="middle" class="cn box-title">输入</text>
  <text x="260" y="365" text-anchor="middle" class="cn box-sub">图像</text>

  <line x1="405" y1="335" x2="495" y2="335" stroke="#3578e5" stroke-width="6" marker-end="url(#arrowBlue)"/>

  <rect x="520" y="275" width="250" height="120" rx="14" fill="#f1f5fb" stroke="#b9c6d8" stroke-width="2"/>
  <text x="645" y="326" text-anchor="middle" class="cn box-title">CNN</text>
  <text x="645" y="365" text-anchor="middle" class="cn box-sub">提取图像特征</text>

  <line x1="790" y1="335" x2="880" y2="335" stroke="#3578e5" stroke-width="6" marker-end="url(#arrowBlue)"/>

  <rect x="905" y="275" width="250" height="120" rx="14" fill="#f1f5fb" stroke="#b9c6d8" stroke-width="2"/>
  <text x="1030" y="326" text-anchor="middle" class="cn box-title">Transformer</text>
  <text x="1030" y="365" text-anchor="middle" class="cn box-sub">理解全局关系</text>

  <line x1="1175" y1="335" x2="1265" y2="335" stroke="#3578e5" stroke-width="6" marker-end="url(#arrowBlue)"/>

  <rect x="1290" y="275" width="190" height="120" rx="14" fill="#eaf2ff" stroke="#99bdf5" stroke-width="2"/>
  <text x="1385" y="326" text-anchor="middle" class="cn box-title">输出</text>
  <text x="1385" y="365" text-anchor="middle" class="cn box-sub">类别 + 位置</text>

  <rect x="70" y="525" width="1460" height="350" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="525" width="18" height="350" rx="9" fill="#159a72"/>
  <text x="120" y="580" class="cn lane-title" fill="#11775a">ACT · 机器人动作预测</text>
  <rect x="1115" y="548" width="350" height="46" rx="23" fill="#e5f7f0"/>
  <text x="1290" y="579" text-anchor="middle" class="cn tag" fill="#11775a">基于 DETR 的代码与结构修改</text>

  <rect x="135" y="635" width="250" height="145" rx="14" fill="#e5f7f0" stroke="#72c9ab" stroke-width="2"/>
  <text x="260" y="682" text-anchor="middle" class="cn box-title">输入</text>
  <text x="260" y="723" text-anchor="middle" class="cn box-sub">相机图像</text>
  <text x="260" y="757" text-anchor="middle" class="cn box-sub" fill="#11775a">+ 机器人关节状态</text>

  <line x1="405" y1="708" x2="495" y2="708" stroke="#159a72" stroke-width="6" marker-end="url(#arrowGreen)"/>

  <rect x="520" y="648" width="250" height="120" rx="14" fill="#f1f5fb" stroke="#b9c6d8" stroke-width="2"/>
  <text x="645" y="699" text-anchor="middle" class="cn box-title">CNN</text>
  <text x="645" y="738" text-anchor="middle" class="cn box-sub">提取图像特征</text>

  <line x1="790" y1="708" x2="880" y2="708" stroke="#159a72" stroke-width="6" marker-end="url(#arrowGreen)"/>

  <rect x="905" y="648" width="250" height="120" rx="14" fill="#f1f5fb" stroke="#b9c6d8" stroke-width="2"/>
  <text x="1030" y="699" text-anchor="middle" class="cn box-title">Transformer</text>
  <text x="1030" y="738" text-anchor="middle" class="cn box-sub">融合并预测</text>

  <line x1="1175" y1="708" x2="1265" y2="708" stroke="#159a72" stroke-width="6" marker-end="url(#arrowGreen)"/>

  <rect x="1290" y="635" width="190" height="145" rx="14" fill="#e5f7f0" stroke="#72c9ab" stroke-width="2"/>
  <text x="1385" y="682" text-anchor="middle" class="cn box-title">输出</text>
  <text x="1385" y="723" text-anchor="middle" class="cn box-sub">未来一段时间的</text>
  <text x="1385" y="757" text-anchor="middle" class="cn box-sub" fill="#11775a">动作序列</text>

  <rect x="350" y="910" width="900" height="58" rx="29" fill="#182033"/>
  <text x="800" y="948" text-anchor="middle" class="cn note" fill="#ffffff">核心变化：从“识别物体”变为“预测机器人接下来怎么动”</text>
</svg>
